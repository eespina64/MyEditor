groups:
  - name: editorial-alerts
    rules:
      # Application down
      - alert: ApplicationDown
        expr: up{job="editorial-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Editorial Workflow Application is down"
          description: "The application has been down for more than 1 minute."

      # High error rate
      - alert: HighErrorRate
        expr: rate(editorial_http_request_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(editorial_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "P95 latency is {{ $value }}s"

      # OJS API errors
      - alert: OJSAPIErrors
        expr: rate(editorial_ojs_api_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OJS API errors detected"
          description: "OJS API error rate is {{ $value }} errors/sec"

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been down for more than 1 minute."

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: rate(editorial_cache_hits_total[5m]) / (rate(editorial_cache_hits_total[5m]) + rate(editorial_cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"
