global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'editorial-workflow'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Editorial Workflow Application
  - job_name: 'editorial-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: /api/metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s

  # Redis metrics (using redis_exporter if available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  # Docker containers (if using cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
