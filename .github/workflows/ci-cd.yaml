name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Daily backup at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - backup
          - restart

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # TEST JOB
  # ============================================
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint || true

      - name: Type check and build
        run: bun run build

  # ============================================
  # BUILD JOB
  # ============================================
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY TO VPS
  # ============================================
  deploy-vps:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check if VPS deployment is configured
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::VPS deployment skipped - secrets not configured"
          fi

      - name: Deploy to VPS
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow

            echo "📦 Pulling latest changes..."
            git pull origin main

            echo "🔨 Building and restarting services..."
            docker compose pull
            docker compose up -d --build app

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            docker compose ps

      - name: Notify Slack on Success
        if: steps.check-secrets.outputs.configured == 'true' && success() && secrets.SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Editorial Workflow deployed successfully*\n\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*By:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Discord on Success
        if: steps.check-secrets.outputs.configured == 'true' && success() && secrets.DISCORD_WEBHOOK_URL
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Deployment Successful",
                "description": "Editorial Workflow deployed successfully",
                "color": 5763719,
                "fields": [
                  {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                  {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                  {"name": "By", "value": "${{ github.actor }}", "inline": true}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify on Failure
        if: failure() && (secrets.SLACK_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL)
        run: |
          # Slack notification
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"❌ Deployment Failed for Editorial Workflow\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}' \
              ${{ secrets.SLACK_WEBHOOK_URL }}
          fi

          # Discord notification
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"embeds": [{"title": "❌ Deployment Failed", "description": "Editorial Workflow deployment failed", "color": 15158332}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi

      - name: Deployment skipped info
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "ℹ️ VPS deployment skipped because secrets are not configured."
          echo ""
          echo "To enable VPS deployment, add these secrets to your repository:"
          echo "  - VPS_HOST: Your VPS IP or hostname"
          echo "  - VPS_USER: SSH username (e.g., root)"
          echo "  - VPS_SSH_KEY: SSH private key"
          echo "  - VPS_PORT: SSH port (optional, default: 22)"
          echo ""
          echo "For notifications, add:"
          echo "  - SLACK_WEBHOOK_URL: Slack incoming webhook URL"
          echo "  - DISCORD_WEBHOOK_URL: Discord webhook URL"

  # ============================================
  # DAILY BACKUP JOB
  # ============================================
  backup:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'backup')
    steps:
      - uses: actions/checkout@v4

      - name: Check if backup is configured
        id: check-backup
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Run backup on VPS
        if: steps.check-backup.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow

            BACKUP_DIR="backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR"

            echo "📦 Creating backup in $BACKUP_DIR..."

            # Backup Redis
            docker compose exec -T redis redis-cli BGSAVE
            sleep 2
            docker cp editorial-redis:/data/dump.rdb "$BACKUP_DIR/redis-dump.rdb" 2>/dev/null || true

            # Backup environment
            cp .env "$BACKUP_DIR/.env.backup" 2>/dev/null || true

            # Backup Grafana dashboards
            docker cp editorial-grafana:/var/lib/grafana "$BACKUP_DIR/grafana-data" 2>/dev/null || true

            # Compress backup
            tar -czf "$BACKUP_DIR.tar.gz" -C "$(dirname $BACKUP_DIR)" "$(basename $BACKUP_DIR)"
            rm -rf "$BACKUP_DIR"

            # Keep only last 7 backups
            ls -t backups/*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm

            echo "✅ Backup completed: $BACKUP_DIR.tar.gz"
            ls -lh backups/*.tar.gz 2>/dev/null | tail -5

      - name: Notify backup completion
        if: steps.check-backup.outputs.configured == 'true' && secrets.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"📦 Daily backup completed for Editorial Workflow"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

  # ============================================
  # RESTART SERVICES JOB
  # ============================================
  restart:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'restart'
    steps:
      - name: Restart services on VPS
        if: secrets.VPS_HOST && secrets.VPS_SSH_KEY
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow
            echo "🔄 Restarting all services..."
            docker compose restart
            echo "✅ Services restarted!"
            docker compose ps

  # ============================================
  # DEPLOY TO KUBERNETES (Optional)
  # ============================================
  deploy-kubernetes:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check if Kubernetes is configured
        id: check-k8s
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check-k8s.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        if: steps.check-k8s.outputs.configured == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Kubernetes
        if: steps.check-k8s.outputs.configured == 'true'
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl rollout status deployment/prod-editorial-workflow -n production --timeout=300s
