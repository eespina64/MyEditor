name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint || true

      - name: Type check and build
        run: bun run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to VPS via SSH (optional - requires secrets)
  deploy-vps:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check if VPS deployment is configured
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::VPS deployment skipped - secrets not configured"
          fi

      - name: Deploy to VPS
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow
            git pull origin main
            docker compose pull
            docker compose up -d --build app
            docker image prune -f

      - name: Deployment skipped
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "ℹ️ VPS deployment skipped because secrets are not configured."
          echo ""
          echo "To enable VPS deployment, add these secrets to your repository:"
          echo "  - VPS_HOST: Your VPS IP or hostname"
          echo "  - VPS_USER: SSH username (e.g., root)"
          echo "  - VPS_SSH_KEY: SSH private key"
          echo "  - VPS_PORT: SSH port (optional, default: 22)"
          echo ""
          echo "Go to: Settings > Secrets and variables > Actions"

  # Deploy to Kubernetes (optional - requires secrets)
  deploy-kubernetes:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check if Kubernetes deployment is configured
        id: check-k8s
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Kubernetes deployment skipped - KUBE_CONFIG not configured"
          fi

      - name: Set up kubectl
        if: steps.check-k8s.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        if: steps.check-k8s.outputs.configured == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Kubernetes
        if: steps.check-k8s.outputs.configured == 'true'
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl rollout status deployment/prod-editorial-workflow -n production --timeout=300s

      - name: Kubernetes deployment skipped
        if: steps.check-k8s.outputs.configured == 'false'
        run: |
          echo "ℹ️ Kubernetes deployment skipped because KUBE_CONFIG is not configured."
          echo ""
          echo "To enable Kubernetes deployment, add this secret:"
          echo "  - KUBE_CONFIG_PRODUCTION: Base64 encoded kubeconfig file"
          echo ""
          echo "Generate with: cat ~/.kube/config | base64 -w 0"
