name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily backup at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - backup
          - restart

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # TEST JOB
  # ============================================
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint || true

      - name: Type check and build
        run: bun run build

  # ============================================
  # BUILD DOCKER IMAGE
  # ============================================
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY TO VPS
  # ============================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow || exit 1
            echo "📦 Pulling latest changes..."
            git pull origin main
            echo "🔨 Building and restarting..."
            docker compose pull
            docker compose up -d --build app
            docker image prune -f
            echo "✅ Done!"
            docker compose ps

      - name: Notify Success (Slack)
        if: steps.check.outputs.ready == 'true' && success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{"text":"✅ Editorial Workflow deployed - ${{ github.sha }}"}' || true

      - name: Notify Success (Discord)
        if: steps.check.outputs.ready == 'true' && success() && secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{"content":"✅ Editorial Workflow deployed - ${{ github.sha }}"}' || true

      - name: Show setup instructions
        if: steps.check.outputs.ready == 'false'
        run: |
          echo "⚠️ VPS deployment skipped - secrets not configured"
          echo ""
          echo "Add these secrets in GitHub Settings > Secrets > Actions:"
          echo "  VPS_HOST     - Your server IP"
          echo "  VPS_USER     - SSH user (default: root)"
          echo "  VPS_SSH_KEY  - SSH private key"
          echo "  VPS_PORT     - SSH port (default: 22)"

  # ============================================
  # DAILY BACKUP
  # ============================================
  backup:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'backup')
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "⚠️ Backup skipped - VPS secrets not configured"
          fi

      - name: Run backup
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow
            BACKUP="backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP"
            docker compose exec -T redis redis-cli BGSAVE 2>/dev/null || true
            sleep 2
            docker cp editorial-redis:/data/dump.rdb "$BACKUP/redis.rdb" 2>/dev/null || true
            cp .env "$BACKUP/.env" 2>/dev/null || true
            tar -czf "$BACKUP.tar.gz" -C backups "$(basename $BACKUP)"
            rm -rf "$BACKUP"
            ls -t backups/*.tar.gz | tail -n +8 | xargs -r rm
            echo "✅ Backup: $BACKUP.tar.gz"

  # ============================================
  # RESTART SERVICES
  # ============================================
  restart:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'restart'
    steps:
      - name: Restart services
        if: secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/editorial-workflow
            docker compose restart
            docker compose ps
            echo "✅ Services restarted!"
