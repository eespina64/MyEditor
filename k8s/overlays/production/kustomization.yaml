apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

namePrefix: prod-

replicas:
  - name: editorial-workflow
    count: 3

images:
  - name: editorial-workflow
    newName: ghcr.io/yourusername/editorial-workflow
    newTag: latest

configMapGenerator:
  - name: editorial-workflow-config
    behavior: merge
    literals:
      - NODE_ENV=production

patchesStrategicMerge:
  - deployment-patch.yaml
